<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .container {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 10px;
      color: #dc3545;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 15px;
    }
    p {
      color: #6c757d;
      margin: 0 0 25px;
      font-size: 14px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      text-decoration: none;
      background-color: #007bff;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>403</h1>
    <h2>No Access</h2>
    <p>You do not have permission to view this page or resource. Please contact your administrator if you believe this is a mistake.</p>
    <a href="/">Return to Home</a>
  </div>

</body>
</html>
