<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launching Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.25rem;
      color: #a0aec0;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .email-form {
      display: flex;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
    }

    input[type="email"] {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="email"]::placeholder {
      color: #9ca3af;
    }

    button {
      padding: 14px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
      .email-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Coming Soon</div>
    <h1>We're launching soon</h1>
    <p>Something exciting is on the way.</p>

    <div class="footer">
      © 2026 | Y M R Technical Services LLC
    </div>
  </div>
</body>
</html>
